<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
__PWA_HEAD__
<title>Morning Brief — Day Run</title>
<style>
@font-face {
  font-family: 'Fraunces';
  src: url(data:font/woff2;base64,__FONT_B64__) format('woff2');
  font-weight: 600;
  font-style: normal;
  font-display: block;
}

:root {
  --void: #0B0E14;
  --panel: #10141C;
  --panel-2: #131926;
  --line: #1E2532;
  --line-hot: #2C3647;
  --ink: #E8E6E1;
  --ink-soft: #97A1B0;
  --ink-dim: #5D6675;
  --ember: #F2793D;
  --ember-deep: #B4501F;
  --signal: #58D6C9;
  --alarm: #FF5F56;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", Menlo, Consolas, monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { background: var(--void); }

body {
  font-family: var(--mono);
  color: var(--ink);
  background:
    radial-gradient(680px 420px at 8% -8%, rgba(242,121,61,.14), transparent 62%),
    radial-gradient(520px 380px at 96% 4%, rgba(88,214,201,.07), transparent 60%),
    var(--void);
  background-attachment: fixed;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  position: relative;
  overflow-x: hidden;
}

/* dot lattice + scanlines */
body::before {
  content: "";
  position: fixed; inset: 0;
  background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,.04) 1px, transparent 0);
  background-size: 30px 30px;
  pointer-events: none;
  z-index: 0;
}
body::after {
  content: "";
  position: fixed; inset: 0;
  background: repeating-linear-gradient(to bottom, rgba(255,255,255,.016) 0 1px, transparent 1px 3px);
  pointer-events: none;
  z-index: 1;
}

.shell {
  position: relative;
  z-index: 2;
  max-width: 1000px;
  margin: 0 auto;
  padding: calc(34px + env(safe-area-inset-top)) calc(30px + env(safe-area-inset-right))
           calc(90px + env(safe-area-inset-bottom)) calc(30px + env(safe-area-inset-left));
}

@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes glow { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
@keyframes sweep { from { stroke-dasharray: 0 100; } }
.r { opacity: 0; animation: rise .55s cubic-bezier(.2,.7,.3,1) forwards; }

/* ── HUD ─────────────────────────────────────── */
.hud {
  display: flex; align-items: center; gap: 18px;
  border: 1px solid var(--line);
  border-left: 2px solid var(--ember);
  background: linear-gradient(90deg, rgba(242,121,61,.07), rgba(19,25,38,.55) 38%);
  padding: 13px 18px;
  animation-delay: .02s;
}
.hud-id { font-size: 11px; letter-spacing: .22em; color: var(--ember); font-weight: 700; white-space: nowrap; }
.hud-date { font-size: 11px; letter-spacing: .18em; color: var(--ink-soft); white-space: nowrap; }
.hud-spacer { flex: 1; }
.stat { font-size: 10px; letter-spacing: .16em; color: var(--ink-dim); padding-right: 12px; border-right: 1px solid var(--line); margin-right: 12px; white-space: nowrap; }
.stat b { color: var(--ink); font-weight: 700; }
.stat.dim b { color: var(--ink-soft); }
.pips { display: flex; gap: 3px; align-items: center; }
.pip { width: 4px; height: 13px; background: var(--line-hot); }
.pip.on { background: var(--ember); box-shadow: 0 0 8px rgba(242,121,61,.55); }
.hud-pct { font-size: 11px; letter-spacing: .16em; color: var(--ink-soft); min-width: 92px; text-align: right; }
.cal-connect {
  font-family: var(--mono); font-size: 9px; letter-spacing: .16em; font-weight: 700;
  color: var(--ink-dim); background: transparent; border: 1px solid var(--line);
  padding: 5px 10px; cursor: pointer; white-space: nowrap;
}
.cal-connect:hover:not(:disabled) { border-color: var(--ember); color: var(--ink); }
.cal-connect:disabled { cursor: default; opacity: .55; }
.cal-connect.connected { color: var(--signal); border-color: rgba(88,214,201,.4); }

/* ── BRIEFING ────────────────────────────────── */
.briefing { margin: 46px 0 40px; padding-left: 22px; border-left: 1px solid var(--line); animation-delay: .12s; }
.kicker { font-size: 10px; letter-spacing: .34em; color: var(--ink-dim); margin-bottom: 16px; }
.headline {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 600;
  font-size: clamp(28px, 4.4vw, 44px);
  line-height: 1.18;
  letter-spacing: -.015em;
  max-width: 20ch;
  color: var(--ink);
}
.headline em { font-style: normal; color: var(--ember); }

/* ── RUN ROUTE ───────────────────────────────── */
.route { margin-bottom: 54px; animation-delay: .2s; }
.route-frame {
  border: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(19,25,38,.5), rgba(11,14,20,.2));
  padding: 20px 18px 6px;
}
.route svg { width: 100%; height: auto; display: block; overflow: visible; }
.trail-dim { fill: none; stroke: var(--line-hot); stroke-width: 1.5; }
.trail-hot { fill: none; stroke: var(--ember); stroke-width: 1.75; filter: drop-shadow(0 0 6px rgba(242,121,61,.55)); animation: sweep 1.1s cubic-bezier(.3,.8,.3,1) .35s backwards; }
/* One shape per node regardless of state (done/live/next); the state class
   sits on the wrapping <g> so the live-clock script can retint a node by
   swapping one class, the same way it already does for .stage. */
.node-ring { r: 6px; fill: var(--void); stroke: var(--line-hot); stroke-width: 1.5; }
.node.done .node-ring { r: 6.5px; fill: var(--ember); stroke: none; }
.node.live .node-ring { r: 8px; fill: var(--void); stroke: var(--signal); stroke-width: 2; }
.node-halo { fill: none; stroke: var(--signal); stroke-width: 1; opacity: 0; }
.node.live .node-halo { opacity: .45; animation: glow 2.4s ease-in-out infinite; }
.node-core { fill: var(--signal); opacity: 0; }
.node.live .node-core { opacity: 1; }
.node-cap { font-family: var(--mono); font-size: 9px; letter-spacing: .16em; fill: var(--ink-dim); }
.node.live .node-cap-name { fill: var(--signal); }
.node.done .node-cap-name { fill: var(--ink-soft); }
.now-rule { stroke: var(--signal); stroke-width: 1; stroke-dasharray: 2 4; opacity: .5; }
.now-tag { font-family: var(--mono); font-size: 9px; letter-spacing: .2em; fill: var(--signal); }

/* ── STAGES ──────────────────────────────────── */
.sec-label { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
.sec-label span { font-size: 10px; letter-spacing: .34em; color: var(--ink-dim); white-space: nowrap; }
.sec-label i { flex: 1; height: 1px; background: var(--line); }

.stage {
  display: grid;
  grid-template-columns: 74px 1fr auto;
  gap: 0 18px;
  align-items: start;
  padding: 22px 20px 22px 0;
  border-top: 1px solid var(--line);
  position: relative;
  transition: background .25s ease;
}
.stage:last-of-type { border-bottom: 1px solid var(--line); }
.stage::before {
  content: ""; position: absolute; left: 0; top: -1px; bottom: -1px; width: 2px;
  background: transparent; transition: background .25s ease;
}
.stage.live::before { background: var(--signal); }
.stage.done::before { background: var(--ember-deep); }
.stage.live { background: linear-gradient(90deg, rgba(88,214,201,.05), transparent 55%); }
.stage.done .stage-name, .stage.done .stage-log { color: var(--ink-dim); }
.stage.done .idx { color: #333F52; }

.idx {
  font-family: 'Fraunces', Georgia, serif;
  font-size: 38px; line-height: .9;
  color: var(--line-hot);
  padding-left: 20px;
  letter-spacing: -.02em;
}
.stage.live .idx { color: var(--signal); }

.stage-name { font-size: 14px; letter-spacing: .16em; font-weight: 700; color: var(--ink); margin-bottom: 9px; }
.tag {
  display: inline-block; margin-left: 10px; padding: 2px 7px;
  font-size: 9px; letter-spacing: .18em; font-weight: 700;
  color: var(--ember); border: 1px solid rgba(242,121,61,.4); background: rgba(242,121,61,.08);
  vertical-align: 2px;
}
.stage.live .tag { color: var(--signal); border-color: rgba(88,214,201,.4); background: rgba(88,214,201,.08); }
.stage.done .tag { color: var(--ink-dim); border-color: var(--line); background: transparent; }
.stage-log { font-size: 12.5px; line-height: 1.65; color: var(--ink-soft); max-width: 62ch; letter-spacing: .01em; }
.stage-time { font-size: 11px; letter-spacing: .14em; color: var(--ink-dim); white-space: nowrap; padding-top: 3px; }
.stage.live .stage-time { color: var(--signal); }

.quest {
  grid-column: 2 / -1;
  margin-top: 16px;
  border-left: 2px solid var(--ember);
  background: linear-gradient(90deg, rgba(242,121,61,.07), rgba(242,121,61,0) 70%);
  padding: 13px 16px;
}
.quest + .quest { margin-top: 9px; }
.quest-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
.quest-sig { font-size: 9px; letter-spacing: .2em; color: var(--ember); font-weight: 700; }
.quest-title { font-size: 13.5px; font-weight: 700; color: var(--ink); letter-spacing: .02em; }
.quest-body { font-size: 12.5px; line-height: 1.65; color: var(--ink-soft); }
.quest-body u { text-decoration: none; border-bottom: 1px solid var(--line-hot); color: var(--ink-soft); }
.quest-actions { margin-top: 10px; display: flex; gap: 8px; }
.quest-actions button {
  font-family: var(--mono); font-size: 9px; letter-spacing: .14em; font-weight: 700;
  color: var(--ink-soft); background: transparent; border: 1px solid var(--line-hot);
  padding: 5px 9px; cursor: pointer; transition: border-color .2s, color .2s;
}
.quest-actions button:hover:not(:disabled) { border-color: var(--ember); color: var(--ink); }
.quest-actions button:disabled { opacity: .5; cursor: default; }

/* Live reconciliation markers — what the calendar says right now, against
   what this page was built saying. Deliberately quiet: a chip and a dim. */
.live-chip {
  margin-left: 10px; font-size: 9px; letter-spacing: .16em; font-weight: 700;
  color: var(--ink-dim); border: 1px solid var(--line); padding: 2px 6px;
  white-space: nowrap;
}
.live-done { opacity: .45; }
.live-done .live-chip { color: var(--signal); border-color: rgba(88,214,201,.35); }
.live-gone { opacity: .4; }
.live-gone .quest-title, .live-gone .stage-name { text-decoration: line-through; }
.live-extras { margin-top: 46px; }
.live-extras .quest { margin-top: 14px; }

/* ── TRIAGE GRID ─────────────────────────────── */
.grid {
  display: grid; grid-template-columns: 1fr 1fr;
  border: 1px solid var(--line);
  background: var(--panel);
}
.cell { padding: 20px 20px 22px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-height: 128px; position: relative; }
.cell:nth-child(2n) { border-right: none; }
.cell:nth-child(n+3) { border-bottom: none; }
.cell.boss { background: linear-gradient(160deg, rgba(255,95,86,.07), transparent 58%); }
.cell.main { background: linear-gradient(160deg, rgba(242,121,61,.055), transparent 58%); }
.cell.arch { background: rgba(11,14,20,.35); }
.rank { display: flex; align-items: center; gap: 9px; margin-bottom: 4px; }
.rank b { font-size: 12px; letter-spacing: .24em; font-weight: 700; }
.cell.boss .rank b { color: var(--alarm); }
.cell.main .rank b { color: var(--ember); }
.cell.side .rank b { color: var(--signal); }
.cell.arch .rank b { color: var(--ink-dim); }
.sig { width: 9px; height: 9px; transform: rotate(45deg); }
.cell.boss .sig { background: var(--alarm); box-shadow: 0 0 10px rgba(255,95,86,.6); }
.cell.main .sig { background: var(--ember); box-shadow: 0 0 10px rgba(242,121,61,.5); }
.cell.side .sig { background: var(--signal); }
.cell.arch .sig { background: var(--line-hot); }
.axis { font-size: 9px; letter-spacing: .2em; color: var(--ink-dim); margin-bottom: 18px; }
.slot { display: flex; gap: 12px; padding-top: 14px; border-top: 1px solid var(--line); margin-top: 14px; }
.slot:first-of-type { margin-top: 0; }
.slot-n { font-size: 10px; letter-spacing: .1em; color: var(--ink-dim); padding-top: 3px; }
.slot-title { font-size: 12.5px; font-weight: 700; color: var(--ink); margin-bottom: 5px; letter-spacing: .02em; }
.slot-body { font-size: 11.5px; line-height: 1.62; color: var(--ink-soft); }
.empty { font-size: 10px; letter-spacing: .22em; color: #2E3746; border-top: 1px dashed var(--line); padding-top: 14px; }

@media (max-width: 720px) {
  .shell { padding: calc(22px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
                   calc(60px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
  .stage { grid-template-columns: 46px 1fr; padding-right: 12px; }
  .idx { font-size: 26px; padding-left: 12px; }
  .stage-time { grid-column: 2; margin-top: 8px; }
  .quest { grid-column: 1 / -1; }
  .node-cap { font-size: 21px; letter-spacing: .1em; }
  .now-tag { font-size: 20px; }
  .grid { grid-template-columns: 1fr; }
  .cell { border-right: none; border-bottom: 1px solid var(--line); min-height: 0; }
  .cell:last-child { border-bottom: none; }
  .hud { flex-wrap: wrap; gap: 10px; }
}
</style>
</head>
<body>
<div class="shell">

  <!-- HUD -->
  <div class="hud r">
    <div class="hud-id">RUN __RUN__</div>
    <div class="hud-date">__DATE__</div>
    <div class="hud-spacer"></div>
    __CAL_UI__
    __STATS__
    <div class="pips">__PIPS__</div>
    <div class="hud-pct">DAY __PCT__%</div>
  </div>

  <!-- BRIEFING -->
  <div class="briefing r">
    <div class="kicker">BRIEFING</div>
    <h1 class="headline">__HEADLINE__</h1>
  </div>

  <!-- ROUTE -->
  <div class="route r">
    <div class="sec-label"><span>RUN ROUTE</span><i></i></div>
    <div class="route-frame" data-span-s="__SPAN_S__" data-span-e="__SPAN_E__">
      <svg viewBox="0 0 940 178" xmlns="http://www.w3.org/2000/svg">
        <path class="trail-dim" pathLength="100" d="__TRAIL__"/>
        <path class="trail-hot" pathLength="100" stroke-dasharray="__ELAPSED__ 100" d="__TRAIL__"/>
        __NOWMARK__
        __NODES__
      </svg>
    </div>
  </div>

  <!-- STAGES -->
  <div class="r" style="animation-delay:.28s">
    <div class="sec-label"><span>STAGES</span><i></i></div>
    __STAGES__
  </div>

  <!-- Filled in by the calendar-sync script with anything on today's calendar
       that postdates this build. Stays empty and hidden otherwise. -->
  <div id="live-extras" class="live-extras" hidden></div>

  __GRID__

</div>
__LIVE_JS__
__CAL_JS__
</body>
</html>
